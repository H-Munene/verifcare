name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mzazi_care_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run openapi:lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mzazi_care_test
          # Real, deployed, non-secret Cognito identifiers - same values already checked into
          # backend/.env.example. Needed because lambda.test.ts imports the real lambda.js module,
          # which calls loadConfig() at import time - vitest.setup.ts's own comment claims CI "sets
          # real environment variables directly," but this step never actually did, for any of the
          # four required Cognito vars, not just the two added this session (CAREGIVER_/
          # FAMILY_MEMBER_USER_POOL_CLIENT_ID). That gap was masked until now by the format:check
          # step failing first, before npm test ever ran.
          USER_POOL_ID: eu-west-1_901G3wGkr
          USER_POOL_CLIENT_ID: 62h8bi9cih94nhcd3hom9kheol
          CAREGIVER_USER_POOL_CLIENT_ID: 4th550b5rk8st5fmgfdio465tr
          FAMILY_MEMBER_USER_POOL_CLIENT_ID: 7b63vkbmrooqvu4g5to6c1gtvk
          # Real, deployed bucket name (HEZ-31) - same reasoning as the Cognito values above;
          # lambda.test.ts's loadConfig() call now requires this too.
          BIOMETRIC_ENROLLMENTS_BUCKET_NAME: mzazicarestack-biometricenrollmentsbuckete1b7d3ba-udjy18fdi2be
          # Same reasoning, for HEZ-85's Rekognition Collection id.
          BIOMETRIC_FACES_COLLECTION_ID: mzazi-care-biometric-faces
          # Placeholder (HEZ-34) - CheckinLivenessFramesBucket doesn't exist in real AWS yet;
          # only loadConfig()'s own validation needs a value here, not a real deployed bucket.
          CHECKIN_LIVENESS_FRAMES_BUCKET_NAME: mzazicarestack-checkinlivenessframesbucket-placeholder

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            backend/package-lock.json
      - run: npm ci
      # cdk synth bundles ApiFunction and MissedVisitSweepFunction via esbuild,
      # run from inside backend/ (NodejsFunction's projectRoot) - it needs
      # backend/node_modules to exist too, not just infra/'s.
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
      - run: npx cdk synth

  acoustic-model-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acoustic-model
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli lint openapi.yaml --config .redocly.yaml
