[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mzazi-acoustic"
version = "0.1.0"
description = "Language-independent acoustic cognitive-risk model for Mzazi Care (see PLAN.md)"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
