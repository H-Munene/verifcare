openapi: 3.1.0
info:
  title: Mzazi Care Acoustic Model - Invocation Contract (Draft)
  version: '0.2'
  description: |
    A draft of the invocation contract between the `api` Lambda function and the `acoustic-model`
    Lambda function, written from the `api` side as part of defining the backend API contract
    (Linear HEZ-12), since `api`'s audio endpoints need to know what they're calling.

    `acoustic-model` is invoked directly via the AWS SDK `Invoke` API (Lambda-to-Lambda,
    synchronous) - not over HTTP. There is no server, no URL, no HTTP status codes here in the
    usual sense. OpenAPI is reused anyway, purely as a convenient, already-tooled way to document
    the JSON request/response shape of that invocation payload - the one "path" below is a named
    contract, not a literal route, and there's deliberately no `servers` block, since none exists.

    Access control is IAM, not network isolation: only the `api` Lambda function's execution role
    is granted `lambda:InvokeFunction` on this function's resource-based policy. There's no VPC
    attachment for `acoustic-model` (it only touches S3, not RDS), so no NAT Gateway and no
    network-level boundary are involved at all - a deliberate change from an earlier version of
    this design, which was ECS-based and reachable only via Service Connect inside the VPC.

    This is explicitly a draft, not a settled contract: `acoustic-model/` has no implementation
    yet. Its language (Python) and packaging (container-image Lambda) were confirmed 2026-09-09 -
    see `docs/project-state.md`. Features, as of the 2026-09-28 redo: language-independent pausing/timing
    features from a custom intensity-based pause detector, plus a small eGeMAPS subset via openSMILE
    (voiced/unvoiced timing, jitter, shimmer, HNR). No transcription, and no language-specific features. Linear HEZ-44, "Define the internal HTTP contract" (milestone "4. Acoustic ML Service"),
    is where this gets finalized once the function is actually scaffolded - update this file then
    rather than treating it as frozen. (HEZ-49, "Health check endpoint," is worth reconsidering
    at that point too: Lambda has no persistent process to health-check the way an ECS task did,
    so an app-level `/health` operation - present in an earlier version of this file - may no
    longer be the right way to verify the function is deployable and working.)

paths:
  /score:
    post:
      summary: Score a visit's recorded audio for cognitive risk
      description: |
        Not a real HTTP path - see the file-level note above. Represents the payload shape of a
        direct `lambda:Invoke` call from `api` to `acoustic-model`.

        Called after `api` confirms the recording is in S3, and only when the dependant has
        `cognitive_monitoring_enabled: true` and `audio_cognitive_monitoring` consent on file -
        `api` is responsible for that gating, not this function.

        Audio is passed by S3 reference, not inline in the invocation payload - both functions can
        reach S3 directly, so there's no reason to pass the audio bytes through the payload too.
      operationId: score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Bucket, s3Key]
              properties:
                s3Bucket:
                  type: string
                  example: mzazi-care-visit-audio
                s3Key:
                  type: string
                visitScheduleId:
                  type: string
                  format: uuid
                  description: For correlation in logs only - not used in scoring.
      responses:
        default:
          description: |
            The function's normal return payload - covers both a successful score and an
            application-level "couldn't score this audio" outcome (too short, unintelligible,
            wrong format). Both are ordinary returns, not thrown exceptions: a Lambda `Invoke`
            distinguishes "the function ran" from "the function threw an unhandled exception"
            (a `FunctionError` on the Invoke API response itself, a transport-level failure, not
            modeled here) - a scoring failure is an expected application outcome, not that.
          content:
            application/json:
              schema:
                type: object
                required: [riskScore, modelVersion]
                properties:
                  riskScore:
                    oneOf:
                      - type: number
                        minimum: 0
                        maximum: 1
                      - type: 'null'
                    description: |
                      Continuous [0, 1] probability score, confirmed by the project owner
                      2026-09-09 (see docs/project-state.md). Matches `audio_records.risk_score`'s
                      `numeric(5,4) CHECK (risk_score BETWEEN 0 AND 1)`. `null` when scoring
                      couldn't complete - see `scoringFailureReason`.
                  modelVersion:
                    type: string
                  scoringFailureReason:
                    type: string
                    description: |
                      Set only when `riskScore` is `null` - why scoring couldn't complete (e.g. `audio_too_short`, `unintelligible`, `unsupported_format`). `api` should still write the `audio_records` row either way, leaving `risk_score`/`model_version` null on failure.
                      `audio_too_short` means under 30 s of speech after trimming leading and trailing silence. That minimum was pre-registered for the language-independent model (2026-09-28), because pause statistics are unreliable on shorter recordings. The caregiver app should therefore capture well over 30 s.
