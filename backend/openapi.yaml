openapi: 3.1.0
info:
  title: Mzazi Care API
  version: '1.0'
  description: |
    The public-facing API for the Mzazi Care `api` AWS Lambda function.

    Consumed by three separate client apps: the admin/supervisor web app, the caregiver mobile
    app, and the family member mobile app. Authentication is via AWS Cognito - clients obtain a
    JWT directly from Cognito (not from this API) and send it as a bearer token; this API verifies
    the token and reads the `role` custom claim (`supervisor` / `caregiver` / `family_member`) for
    authorization. There is no `/login` endpoint here.

    Conventions:
      - Every path is prefixed `/v1`.
      - Errors are RFC 7807 Problem Details (`application/problem+json`) - see `Problem` below.
      - List endpoints are cursor-paginated (`cursor` + `limit` query params, `nextCursor` in the
        response) - stable under concurrent inserts, which matters for `visit_schedules` and
        `notification_log`.
      - Visit audio is uploaded directly to S3 via a presigned URL this API
        issues, not proxied through the API - see the `*/upload-url` endpoints.
      - Field names in request/response bodies are camelCase, mapping 1:1 to the snake_case columns
        in docs/schema.sql / backend/src/db/schema.ts (e.g. `phoneNumber` <-> `phone_number`).

servers:
  - url: /v1
    description: All paths below are relative to this - the `/v1` prefix is not repeated per-path.

security:
  - bearerAuth: []

tags:
  - name: Dashboard
    description: The supervisor console's Overview page.
  - name: Compliance
    description: The supervisor console's Compliance tab - period reports on visit verification, exceptions, alert response, consent, terms acceptance and the audit trail, with CSV exports.
  - name: Family Link Requests
    description: A family member asking a dependant's primary contact to link them, and the primary contact's answer.
  - name: Terms
    description: The terms of use and privacy notice each mobile app's users must accept (the consent screen).
  - name: Users
    description: Generic user profiles (any role) - creation, lookup, and offboarding.
  - name: Caregivers
    description: The caregiver-specific extension of a user.
  - name: Dependants
    description: Dependants and their linked family members.
  - name: Visit Schedules
    description: Scheduling, rescheduling, and querying visits, including the live-visits and visit-history views.
  - name: Check-in
    description: The geofence, code-scan and supervisor-override steps of the check-in verification flow.
  - name: Check-out
    description: Requesting check-out, then confirming it with the family's code or overriding with a reason.
  - name: Voice
    description: Voice enrolment and the advisory checks of each visit recording against a voiceprint.
  - name: Visit Plans
    description: Clustering dependants and ordering each caregiver's day.
  - name: Visit Recovery
    description: Offering a late visit to the nearest available caregiver.
  - name: Audio
    description: The visit's 30-second recording, which the dependant's family can listen to.
  - name: Consent
    description: Recording and revoking consent for location checks and visit audio.
  - name: Notifications
    description: Missed-visit and check-in-override alerts, and their acknowledgement.

paths:
  /users:
    post:
      tags: [Users]
      summary: Create a user profile
      description: |
        Creates the `users` row for an identity that already exists in Cognito (self-signup or a
        supervisor-issued invite). `cognitoSub` must match the `sub` claim of a real Cognito user;
        this endpoint does not create Cognito accounts itself. `role: caregiver` is not accepted
        here - use `POST /caregivers`, which creates both the `users` and `caregivers` rows
        atomically, matching their 1:1 shared-PK relationship in the schema.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Users]
      summary: List users
      description: Supervisor-only.
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: email
          in: query
          description: "Exact match, not search/prefix. Added so a supervisor can look up an existing user (e.g. a dependant's primary contact) by email instead of needing their id or Cognito sub already."
          schema:
            type: string
            format: email
        - name: phoneNumber
          in: query
          description: 'Exact match, not search/prefix. Same rationale as `email` above.'
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        default:
          $ref: '#/components/responses/Problem'

  /users/me:
    get:
      tags: [Users]
      summary: Get the caller's own user
      description: |
        The caller's own `users` row, found by their token's Cognito sub. Clients only know their
        sub, while other responses refer to users by internal id (e.g. a dependant's
        family-member links), so this is how a client recognizes its own entries. 404 if the
        caller hasn't completed registration (`POST /users`) yet.
      operationId: getCurrentUser
      responses:
        '200':
          description: The caller's user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      operationId: getUser
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Users]
      summary: Update a user
      description: |
        Covers offboarding via status flag (`status: suspended` or `status: deactivated`) - hard
        deletes are not supported anywhere in this API, matching schema.sql's NO ACTION /
        soft-delete-only referential policy.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /caregivers:
    post:
      tags: [Caregivers]
      summary: Register a caregiver
      description: Creates the `users` row and the `caregivers` extension row atomically.
      operationId: createCaregiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaregiverRequest'
      responses:
        '201':
          description: Caregiver created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Caregivers]
      summary: List caregivers
      operationId: listCaregivers
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          description: Order by `name` or `hireDate`; a leading `-` sorts descending. A missing hire date sorts earliest. Without it, the list is in id order. A cursor only works with the sort it came from.
          schema:
            type: string
            enum: [name, -name, hireDate, -hireDate]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of caregivers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaregiverPage'
        default:
          $ref: '#/components/responses/Problem'

  /caregivers/{caregiverId}:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags: [Caregivers]
      summary: Get a caregiver
      operationId: getCaregiver
      responses:
        '200':
          description: The caregiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Caregivers]
      summary: Update a caregiver
      description: 'Covers offboarding via `active: false`, matching `caregivers.active`.'
      operationId: updateCaregiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaregiverRequest'
      responses:
        '200':
          description: The updated caregiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caregiver'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /caregivers/{caregiverId}/stats:
    parameters:
      - $ref: '#/components/parameters/CaregiverId'
    get:
      tags: [Caregivers]
      summary: Visit statistics for a caregiver
      description: |
        What the caregiver's page shows at a glance: their visits over the last 30 days by outcome,
        their completion rate, and their next and most recent visits, across every dependant they
        visit. Outcomes follow the same rules as `GET /dashboard/overview`'s trend. Supervisor-only,
        like every `/caregivers` route.
      operationId: getCaregiverStats
      responses:
        '200':
          description: The caregiver's visit statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitStats'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /dependants:
    post:
      tags: [Dependants]
      summary: Register a dependant
      description: |
        Atomically creates the `dependants` row and its first `dependant_family_members` link
        (`primaryFamilyMember`, marked `isPrimaryContact: true`), per architecture.md's
        atomic-first-family-member-at-registration requirement.

        If the primary family member has given both consents on the family app's consent screen
        (`POST /terms/current/accept`), the same transaction records `location_verification` and
        `visit_audio` consent for the new dependant, granted by them.
      operationId: createDependant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDependantRequest'
      responses:
        '201':
          description: Dependant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Dependants]
      summary: List dependants
      description: A family_member caller sees only dependants they're linked to; a supervisor sees all.
      operationId: listDependants
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DependantStatus'
        - name: sort
          in: query
          description: Order by `name` or `dob`; a leading `-` sorts descending. Without it, the list is in id order. A cursor only works with the sort it came from.
          schema:
            type: string
            enum: [name, -name, dob, -dob]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of dependants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantPage'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    get:
      tags: [Dependants]
      summary: Get a dependant
      operationId: getDependant
      responses:
        '200':
          description: The dependant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Dependants]
      summary: Update a dependant
      description: |
        Covers geofence adjustments and offboarding via `status`.
        A supervisor may change any field. The dependant's primary-contact family member may change
        every field except `status` and `geofenceRadiusMeters` (403): the radius is what caregiver
        check-in is verified against, so widening it stays a supervisor decision.
      operationId: updateDependant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDependantRequest'
      responses:
        '200':
          description: The updated dependant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dependant'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/stats:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    get:
      tags: [Dependants]
      summary: Visit statistics for a dependant
      description: |
        What the dependant's page shows at a glance: their visits over the last 30 days by outcome,
        the completion rate, and the next and most recent visits. Outcomes follow the same rules as
        `GET /dashboard/overview`'s trend. The same access as `GET /dependants/{dependantId}`: a
        supervisor, or a family member linked to this dependant (403 otherwise).
      operationId: getDependantStats
      responses:
        '200':
          description: The dependant's visit statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitStats'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/family-members:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    post:
      tags: [Dependants]
      summary: Link an additional family member to a dependant
      description: |
        Allowed for a supervisor or any family member already linked to the dependant. Adding
        someone with `isPrimaryContact: true` demotes the current primary contact, so a linked
        family member may only do that if they are the current primary contact themselves (403
        otherwise).
      operationId: addDependantFamilyMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFamilyMemberRequest'
      responses:
        '201':
          description: Family member linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantFamilyMember'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Dependants]
      summary: List a dependant's linked family members
      operationId: listDependantFamilyMembers
      responses:
        '200':
          description: The linked family members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DependantFamilyMember'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/family-members/{userId}:
    parameters:
      - $ref: '#/components/parameters/DependantId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Dependants]
      summary: Update a family-member link
      description: Covers `relationship` and reassigning `isPrimaryContact` (at most one primary contact per dependant, enforced by a partial unique index).
      operationId: updateDependantFamilyMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFamilyMemberRequest'
      responses:
        '200':
          description: The updated link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantFamilyMember'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/care-tasks:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    post:
      tags: [Dependants]
      summary: Create a care-plan task for a dependant
      description: |
        Visit task checklist (docs/visit-task-checklist-plan.md). Supervisor-only - the care plan
        is authored by a supervisor on a dedicated Care Plan screen, not by the caregiver and not
        part of dependant registration.
      operationId: createCareTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCareTaskRequest'
      responses:
        '201':
          description: The created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Dependants]
      summary: List a dependant's care-plan tasks
      description: Supervisor sees any dependant's tasks; a family_member sees only a linked dependant's, same ownership rule as `GET /dependants/{dependantId}`.
      operationId: listCareTasks
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
          description: Omit to list every task (active and retired); set to filter to one or the other.
      responses:
        '200':
          description: The dependant's care-plan tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareTask'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/care-tasks/{careTaskId}:
    parameters:
      - $ref: '#/components/parameters/DependantId'
      - $ref: '#/components/parameters/CareTaskId'
    patch:
      tags: [Dependants]
      summary: Update or retire a care-plan task
      description: "Supervisor-only. Retiring (`active: false`) keeps the task's history on any `visit_task_completions` rows that already reference it, but stops it appearing on future visits."
      operationId: updateCareTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCareTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareTask'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules:
    post:
      tags: [Visit Schedules]
      summary: Schedule a visit
      description: |
        Rejected with `409 Conflict` if it would double-book the caregiver or dependant into an
        overlapping window (the `excl_visit_schedules_*_overlap` constraints).
      operationId: createVisitSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitScheduleRequest'
      responses:
        '201':
          description: Visit scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSchedule'
        '409':
          description: Double-booking conflict - the caregiver or dependant already has an overlapping, non-cancelled visit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unschedulable'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Visit Schedules]
      summary: List visit schedules
      description: |
        `status=in_progress` serves the live-visits dashboard (REST polling, per architecture.md -
        no WebSocket/real-time infrastructure). Date-range filters serve visit history.
      operationId: listVisitSchedules
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VisitStatus'
        - name: caregiverId
          in: query
          schema:
            type: string
            format: uuid
        - name: dependantId
          in: query
          schema:
            type: string
            format: uuid
        - name: scheduledStartFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: scheduledStartTo
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Order by `scheduledStart`; a leading `-` sorts latest first. Without it, the list is in id (creation) order. A cursor only works with the sort it came from.
          schema:
            type: string
            enum: [scheduledStart, -scheduledStart]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of visit schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSchedulePage'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Visit Schedules]
      summary: Get a visit schedule
      operationId: getVisitSchedule
      responses:
        '200':
          description: The visit schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSchedule'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Visit Schedules]
      summary: Reschedule or cancel a visit
      operationId: updateVisitSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisitScheduleRequest'
      responses:
        '200':
          description: The updated visit schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSchedule'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Rescheduling into an overlapping window is rejected the same way creation is.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unschedulable'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/verification:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Visit Schedules]
      summary: Get the verification audit trail for a visit
      description: The `verification_events` row plus every `verification_attempts` row (pass and fail) for this visit - the audit drill-down behind the admin web app's visit-history view.
      operationId: getVisitVerification
      responses:
        '200':
          description: The verification event and its attempt history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationAudit'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/task-outcomes:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Visit Schedules]
      summary: Get the recorded care-task outcomes for a visit
      description: |
        What the caregiver recorded for each care task on this visit, for any visit status, under
        the same read rule as `GET /visit-schedules/{visitScheduleId}` (supervisor: any visit;
        caregiver: own visits; family member: visits for a linked dependant). Only recorded
        outcomes are returned, not the live care plan, so a task deactivated after the visit still
        shows, and a visit that never started returns an empty array.
      operationId: getVisitTaskOutcomes
      responses:
        '200':
          description: The recorded outcomes, in care-plan order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitTaskOutcome'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/checkin/geofence:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-in]
      summary: Validate the caregiver's location against the dependant's geofence
      description: |
        Haversine distance against the dependant's `geofence_lat`/`geofence_lng`/
        `geofence_radius_meters`, an accuracy threshold, and rejection of Android mock-location
        reports. On success, issues a short-lived session token (stored hashed, as
        `verification_events.session_token_hash`) that scopes the rest of the check-in flow.
        Writes a `verification_attempts` row (`attempt_type: geofence`) either way.
      operationId: submitGeofenceCheckin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceCheckinRequest'
      responses:
        '200':
          description: Geofence check passed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceCheckinResult'
        '422':
          description: |
            Geofence check failed. `failureReason` is one of `out_of_range`/`insufficient_accuracy`
            (retriable - the caregiver can move closer or wait for a better fix) or
            `mock_location_detected` (a hard block - the app should not offer a retry).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/checkin/context:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Check-in]
      summary: Get the dependant display name and geofence for a visit, before check-in starts
      description: |
        View-only, pre-geofence - no `X-Checkin-Session-Token` is required (unlike every route past
        the geofence step), since none exists yet at this point. Lets the caregiver app render the
        geofence circle/marker and confirm the right dependant/address before attempting a GPS
        read. Deliberately narrow: not the full dependant record (no `primaryConditionSummary`,
        `county`/`constituency`/`ward`, etc.) - a caregiver needs enough to render the map and
        confirm they're at the right home, nothing else. Same caregiver-only, own-visit,
        still-'scheduled' rule as every other route in this router.
      operationId: getCheckinContext
      responses:
        '200':
          description: Context for the check-in map screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinContext'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/checkin/qr:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-in]
      summary: Issue the check-in code shown on a family member's phone
      description: |
        Family members linked to the visit's dependant only. The phone's own position must pass the
        same mock-location, accuracy and radius checks as the caregiver's, so a code can't be
        forwarded from elsewhere. The code is random, single-use, bound to this visit and valid for
        about a minute; the app asks for a new one while the screen is open. Only its hash is
        stored, and of the family phone's position only the distance from the home is kept.
      operationId: issueCheckinCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceCheckinRequest'
      responses:
        '201':
          description: The code to display.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCode'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Problem'
  /visit-schedules/{visitScheduleId}/checkout/qr:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-out]
      summary: Issue the check-out code shown on a family member's phone
      description: |
        Once the caregiver has requested check-out. Only the family member whose code started the
        visit, or any linked family member when a supervisor override started it. The phone must
        pass the same position checks as at check-in. The code works like the check-in code, and
        also carries 6 digits for the caregiver to type; the digits are stored only as a hash.
      operationId: issueCheckoutCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceCheckinRequest'
      responses:
        '201':
          description: The code to display.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinCode'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The caregiver hasn't asked to check out yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /visit-schedules/{visitScheduleId}/checkin/qr-scan:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-in]
      summary: Scan a family member's code to start the visit
      description: |
        The assigned caregiver only, holding the session token from the geofence step. Consuming
        the code and starting the visit happen in one transaction, so a code works exactly once.
        A refused scan is a 422 whose `failureReason` is `invalid_qr`, `expired_qr` or `used_qr`.
      operationId: scanCheckinCode
      security:
        - bearerAuth: []
          checkinSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: The visit has started.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkinAt]
                properties:
                  status:
                    type: string
                    enum: [in_progress]
                  checkinAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Problem'
  /visit-schedules/{visitScheduleId}/checkin/override:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-in]
      summary: Ask a supervisor to start the visit when no family member can show a code
      description: |
        The assigned caregiver only, holding the session token from the geofence step. One open
        request per visit. A visit started this way never counts as fully verified and is reported
        as an exception.
      operationId: requestCheckinOverride
      security:
        - bearerAuth: []
          checkinSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/CheckinOverrideReason'
                note:
                  type: string
                  maxLength: 500
                  description: Required when `reason` is `other`.
      responses:
        '201':
          description: The request is waiting for a supervisor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinOverride'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Check-in]
      summary: The latest override request for this visit, for the caregiver app to poll
      operationId: getCheckinOverride
      responses:
        '200':
          description: The latest request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinOverride'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /checkin-overrides:
    get:
      tags: [Check-in]
      summary: List check-in override requests (supervisors only)
      operationId: listCheckinOverrides
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CheckinOverrideStatus'
      responses:
        '200':
          description: Requests in that status, oldest first; `pending` by default.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckinOverrideListItem'
  /checkin-overrides/{overrideId}/approve:
    parameters:
      - name: overrideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Check-in]
      summary: Approve an override and start the visit (supervisors only)
      operationId: approveCheckinOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinOverrideDecision'
      responses:
        '200':
          description: Approved.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /checkin-overrides/{overrideId}/deny:
    parameters:
      - name: overrideId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Check-in]
      summary: Deny an override (supervisors only)
      operationId: denyCheckinOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinOverrideDecision'
      responses:
        '200':
          description: Denied.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /visit-schedules/{visitScheduleId}/audio/requirement:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Audio]
      summary: Which of the visit's two recordings are needed, and which exist
      description: |
        The assigned caregiver only. A visit has a recording of the caregiver and one of the
        dependant. Each is `required` when that person has visit-audio consent.
      operationId: getAudioRequirement
      responses:
        '200':
          description: The requirement for each recording.
          content:
            application/json:
              schema:
                type: object
                required: [caregiver, dependant]
                properties:
                  caregiver:
                    $ref: '#/components/schemas/RecordingRequirement'
                  dependant:
                    $ref: '#/components/schemas/RecordingRequirement'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
  /visit-schedules/{visitScheduleId}/audio/{role}/upload-url:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
      - $ref: '#/components/parameters/RecordingRole'
    post:
      tags: [Audio]
      summary: Get a presigned URL to upload one of the visit's recordings
      description: The assigned caregiver, during the visit, with that person's visit-audio consent. Upload as `audio/mp4`.
      operationId: createAudioUploadUrl
      responses:
        '201':
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUpload'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
  /visit-schedules/{visitScheduleId}/audio/{role}:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
      - $ref: '#/components/parameters/RecordingRole'
    post:
      tags: [Audio]
      summary: Confirm an uploaded recording, which checks the voice
      description: |
        One recording per person per visit; confirming again replaces it, so a retry is safe.
        The recording is saved first, then checked against the voiceprint of the person it claims
        to be (with voice-verification consent and an enrolment). The check is advisory: its
        result is stored and never blocks anything, and a failed check is stored as
        `unavailable`. The caregiver is not shown it.
      operationId: createAudioRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key, durationSeconds]
              properties:
                s3Key:
                  type: string
                durationSeconds:
                  type: integer
                  minimum: 10
                  maximum: 31
      responses:
        '201':
          description: Recorded.
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Problem'
  /visit-schedules/{visitScheduleId}/audio:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Audio]
      summary: Get a short-lived URL to play the dependant's recording
      description: |
        Family members linked to the visit's dependant only; supervisors and caregivers get a 403.
        Every URL issued is audit-logged as `visit_audio.listen`. Recordings are deleted after 90
        days, after which this returns 410.
      operationId: getAudioPlayback
      responses:
        '200':
          description: A URL valid for five minutes.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt, durationSeconds, uploadedAt]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  durationSeconds:
                    type: integer
                  uploadedAt:
                    type: string
                    format: date-time
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Problem'
  /visit-plans:
    get:
      tags: [Visit Plans]
      summary: Plans for a day (supervisors only)
      operationId: listVisitPlans
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The day's plans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitPlan'
    post:
      tags: [Visit Plans]
      summary: Draft a day's plan (supervisors only)
      description: |
        Clusters the dependants into one group per available caregiver, gives each group to the
        caregiver based closest to it, orders the stops and works out visit times. Creates no
        visits until published. Anyone who can't be planned is listed with the reason.
      operationId: createVisitPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, shiftStart, shiftEnd, visitMinutes]
              properties:
                date:
                  type: string
                  format: date
                shiftStart:
                  type: string
                  description: HH:MM, Nairobi time.
                shiftEnd:
                  type: string
                  description: HH:MM, Nairobi time.
                visitMinutes:
                  type: integer
                  minimum: 15
                  maximum: 240
                dependantIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Defaults to every active dependant.
                caregiverIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Defaults to every active caregiver.
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlan'
        '400':
          $ref: '#/components/responses/Problem'
  /visit-plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Visit Plans]
      summary: One plan (supervisors only)
      operationId: getVisitPlan
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlan'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Visit Plans]
      summary: Rearrange a draft (supervisors only)
      description: Send each caregiver's stops in order. Times are recalculated, and anyone left out or no longer fitting becomes unplaced.
      operationId: updateVisitPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clusters]
              properties:
                clusters:
                  type: array
                  items:
                    type: object
                    required: [caregiverId, dependantIds]
                    properties:
                      caregiverId: { type: string, format: uuid }
                      dependantIds:
                        type: array
                        items: { type: string, format: uuid }
      responses:
        '200':
          description: The updated draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlan'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
  /visit-plans/{planId}/publish:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Visit Plans]
      summary: Turn a draft into real visits (supervisors only)
      operationId: publishVisitPlan
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPlan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Problem'
  /recovery-offers/mine:
    get:
      tags: [Visit Recovery]
      summary: The caller's open offers to cover a late visit
      description: Shows the ward and times only. The dependant's name and address follow on accepting.
      operationId: listMyRecoveryOffers
      responses:
        '200':
          description: Open offers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, proposedStart, proposedEnd, distanceMeters, expiresAt]
                      properties:
                        id: { type: string, format: uuid }
                        proposedStart: { type: string, format: date-time }
                        proposedEnd: { type: string, format: date-time }
                        distanceMeters: { type: integer }
                        expiresAt: { type: string, format: date-time }
                        ward: { type: [string, 'null'] }
  /recovery-offers/{offerId}/accept:
    parameters:
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Visit Recovery]
      summary: Take over the visit
      description: The original visit becomes `reassigned` and a replacement is created for the caller.
      operationId: acceptRecoveryOffer
      responses:
        '200':
          description: The replacement visit.
          content:
            application/json:
              schema:
                type: object
                required: [visitScheduleId, scheduledStart, scheduledEnd]
                properties:
                  visitScheduleId: { type: string, format: uuid }
                  scheduledStart: { type: string, format: date-time }
                  scheduledEnd: { type: string, format: date-time }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /recovery-offers/{offerId}/decline:
    parameters:
      - name: offerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Visit Recovery]
      summary: Decline, passing the offer to the next nearest caregiver
      operationId: declineRecoveryOffer
      responses:
        '204':
          description: Declined.
        '404':
          $ref: '#/components/responses/NotFound'
  /visit-schedules/{visitScheduleId}/checkout/request:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-out]
      summary: Ask to check out, once every requirement is met
      description: |
        The assigned caregiver, inside the dependant's geofence radius. Every active, required
        care task must be addressed (any status recorded). The caregiver's own recording is needed
        when they have visit-audio consent (`failureReason: caregiver_recording_required`), and the
        dependant's, or an `audioSkipReason`, when the dependant has it
        (`failureReason: dependant_recording_required`). The visit stays in progress until the
        family confirms it or the caregiver overrides.
      operationId: requestCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gpsLat, gpsLng]
              properties:
                gpsLat:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                gpsLng:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                audioSkipReason:
                  $ref: '#/components/schemas/AudioSkipReason'
                audioSkipNote:
                  type: string
                  maxLength: 500
                  description: Required when `audioSkipReason` is `other`.
      responses:
        '200':
          description: The family can now show the check-out code.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkoutRequestedAt]
                properties:
                  status:
                    type: string
                    enum: [awaiting_confirmation]
                  checkoutRequestedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A required task or recording is missing, or the visit isn't in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The caregiver is outside the dependant's geofence radius; `detail` gives the distance and the radius.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /visit-schedules/{visitScheduleId}/checkout/qr-scan:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-out]
      summary: Complete check-out with the family's scanned code
      description: Single-use and bound to this visit; a check-in code is refused. Re-checks the caregiver's position.
      operationId: checkoutWithQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, gpsLat, gpsLng]
              properties:
                gpsLat:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                gpsLng:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                token:
                  type: string
      responses:
        '200':
          description: Checked out; the visit is completed.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkoutAt, checkoutMethod]
                properties:
                  status:
                    type: string
                    enum: [completed]
                  checkoutAt:
                    type: string
                    format: date-time
                  checkoutMethod:
                    type: string
                    enum: [qr, code, override]
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Check-out hasn't been requested, or the visit isn't in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The code is invalid, used or expired (`failureReason`), or the caregiver is outside the radius.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /visit-schedules/{visitScheduleId}/checkout/code:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-out]
      summary: Complete check-out with the 6 digits under the family's code
      description: After 5 wrong codes in 10 minutes, typing is refused with a 429 for a while; scanning still works.
      operationId: checkoutWithCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, gpsLat, gpsLng]
              properties:
                gpsLat:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                gpsLng:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Checked out; the visit is completed.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkoutAt, checkoutMethod]
                properties:
                  status:
                    type: string
                    enum: [completed]
                  checkoutAt:
                    type: string
                    format: date-time
                  checkoutMethod:
                    type: string
                    enum: [qr, code, override]
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Check-out hasn't been requested, or the visit isn't in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The code is wrong, used or expired (`failureReason`), or the caregiver is outside the radius.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many wrong codes for this visit recently.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /visit-schedules/{visitScheduleId}/checkout/override:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Check-out]
      summary: Complete check-out without the family's code
      description: |
        Completes the visit at once, so the caregiver is never kept waiting. The reason is shown to
        supervisors in the visit's details and as a `checkout_override` exception in Compliance.
        Nobody approves it. Re-checks the caregiver's position.
      operationId: checkoutWithOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, gpsLat, gpsLng]
              properties:
                gpsLat:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                gpsLng:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                reason:
                  $ref: '#/components/schemas/CheckoutOverrideReason'
                note:
                  type: string
                  maxLength: 1000
                  description: Required when `reason` is `other`.
      responses:
        '200':
          description: Checked out; the visit is completed.
          content:
            application/json:
              schema:
                type: object
                required: [status, checkoutAt, checkoutMethod]
                properties:
                  status:
                    type: string
                    enum: [completed]
                  checkoutAt:
                    type: string
                    format: date-time
                  checkoutMethod:
                    type: string
                    enum: [qr, code, override]
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Check-out hasn't been requested, or the visit isn't in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The caregiver is outside the dependant's geofence radius.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /visit-schedules/{visitScheduleId}/tasks:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    get:
      tags: [Visit Schedules]
      summary: Get this visit's task checklist
      description: |
        Visit task checklist (docs/visit-task-checklist-plan.md). Caregiver-only, own visit,
        `in_progress` only - the checklist is worked through during the visit, after check-in and
        before checkout. Live-joined against dependant_care_tasks (active, for this visit's
        dependant) - not a snapshot, so a care-plan edit made mid-visit is reflected immediately.
      operationId: listVisitTasks
      responses:
        '200':
          description: This visit's task checklist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VisitTask'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/tasks/{careTaskId}:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
      - $ref: '#/components/parameters/CareTaskId'
    put:
      tags: [Visit Schedules]
      summary: Record (or correct) this visit's completion status for one task
      description: Upserts - a second submission for the same task replaces the first, rather than appending. Rejects with 409 once the visit is no longer `in_progress` ("locked after checkout" - see the plan doc's section 2).
      operationId: putVisitTaskCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutVisitTaskCompletionRequest'
      responses:
        '200':
          description: The recorded completion.
          content:
            application/json:
              schema:
                type: object
                required: [careTaskId, status, reason, notes, completedAt]
                properties:
                  careTaskId:
                    type: string
                    format: uuid
                  status:
                    $ref: '#/components/schemas/TaskCompletionStatus'
                  reason:
                    oneOf: [{ $ref: '#/components/schemas/TaskSkipReason' }, { type: 'null' }]
                  notes:
                    type: [string, 'null']
                  completedAt:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The visit is not `in_progress` (either not yet checked in, or already past checkout).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /consent-records:
    post:
      tags: [Consent]
      summary: Record consent
      description: Written at registration time; `grantedBy` is the registering family member or admin where the subject can't consent directly.
      operationId: createConsentRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsentRecordRequest'
      responses:
        '201':
          description: Consent recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Consent]
      summary: List consent records for a subject
      operationId: listConsentRecords
      parameters:
        - name: subjectType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SubjectType'
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The subject's consent records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentRecord'
        default:
          $ref: '#/components/responses/Problem'

  /consent-records/{consentRecordId}/revoke:
    parameters:
      - name: consentRecordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Consent]
      summary: Revoke a consent record
      description: Sets `revoked_at`; the row is never deleted.
      operationId: revokeConsentRecord
      responses:
        '200':
          description: The revoked consent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /dependants/{dependantId}/family-members/link:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    post:
      tags: [Dependants]
      summary: Link an existing account by email (primary contact)
      description: |
        The dependant's primary contact links someone who already has a family-member account,
        found by their exact email, with no request or approval. Never creates an account; someone
        without one is told to sign up and send a link request instead. Only a primary contact can
        learn from the 404 whether an email is registered.
      operationId: linkExistingFamilyMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                relationship:
                  type: string
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependantFamilyMember'
        '403':
          description: The caller isn't the dependant's primary contact.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No family-member account uses that email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Already linked to this dependant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: The Overview page's data for one day (supervisors only)
      description: |
        One Nairobi calendar day's visits (cancelled ones left out), each with its dependant's home
        location and a `state` for the map: `upcoming` (not checked in, start not reached),
        `awaiting_checkin` (not checked in, between start and end), `checked_in` (checked in, with
        or without a checkout since), or `no_checkin` (end passed with no check-in, or marked
        missed/investigated). Also the 14 days of visit outcomes ending on that day, and what needs
        a supervisor's attention now. Days are Africa/Nairobi days whatever the caller's time zone.
      operationId: getDashboardOverview
      parameters:
        - name: date
          in: query
          required: false
          description: YYYY-MM-DD; defaults to today in Nairobi.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
        '400':
          description: The date isn't a real YYYY-MM-DD date.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/visits:
    get:
      tags: [Compliance]
      summary: Visit verification summary per caregiver or dependant (supervisors only)
      description: |
        Every visit that started in the period (Nairobi days), counted per person with the
        Overview's own outcome rules, plus the period's totals. A visit is `fullyVerified` when it
        was checked in by scanning a family member's code, and it was checked out inside the
        home radius (visits checked out before checkout location was recorded can't show the last
        part, so they don't count). A check-in more than 15 minutes after the scheduled start is
        `late` (a report figure only; late check-ins aren't blocked).
      operationId: getComplianceVisitSummary
      parameters:
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [caregiver, dependant]
            default: caregiver
        - name: sort
          in: query
          description: A column, `-` prefixed for descending. People with no rate yet sort last.
          schema:
            type: string
            enum:
              [
                name,
                -name,
                total,
                -total,
                completionRate,
                -completionRate,
                verifiedRate,
                -verifiedRate,
                missed,
                -missed,
                late,
                -late,
                missingCheckout,
                -missingCheckout,
              ]
            default: name
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceVisitSummary'
        '400':
          description: A parameter is malformed, or the period runs backwards or covers more than 366 days.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/caregiver-performance:
    get:
      tags: [Compliance]
      summary: How each caregiver's visits went over a period (supervisors only)
      description: |
        Separate measures with no overall score. A miss resolved as outside the caregiver's control
        is counted as excused rather than against them, and a visit taken over by someone else is
        a miss for the original caregiver and covered for the one who stepped in.
      operationId: getCaregiverPerformance
      parameters:
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: One row per caregiver with activity in the period.
          content:
            application/json:
              schema:
                type: object
                required: [period, items]
                properties:
                  period:
                    $ref: '#/components/schemas/Period'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaregiverPerformanceRow'
  /compliance/exceptions:
    get:
      tags: [Compliance]
      summary: Missed visits, missing checkouts and failed checks, with how each was resolved
      description: |
        Visits in the period a supervisor should account for, newest first: `missed` (no check-in
        by the end, or marked missed/investigated), `missing_checkout` (checked in, end passed, no
        checkout), `failed_check` (at least one failed check-in attempt), and `supervisor_override` (started
        by a supervisor because no family member could show a code). Cancelled
        visits are never exceptions. Each carries its latest resolution, if any.
      operationId: listComplianceExceptions
      parameters:
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
        - name: kind
          in: query
          schema:
            $ref: '#/components/schemas/ExceptionKind'
        - name: resolved
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of exceptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceExceptionPage'
        '400':
          description: A parameter is malformed, or the period runs backwards or covers more than 366 days.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/alerts:
    get:
      tags: [Compliance]
      summary: How quickly missed-visit alerts raised in the period were acknowledged
      operationId: getComplianceAlertResponse
      parameters:
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: The alert response report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceAlertResponse'
        '400':
          description: A parameter is malformed, or the period runs backwards or covers more than 366 days.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/consents:
    get:
      tags: [Compliance]
      summary: The consent register - every active caregiver and dependant's consents
      description: |
        Each consent type's current state per person (`active`, `revoked` or `none`), who granted
        and who revoked it, and how many upcoming visits are booked for someone without location
        consent (possible only when consent was revoked after booking).
      operationId: getComplianceConsentRegister
      parameters:
        - name: subjectType
          in: query
          schema:
            type: string
            enum: [caregiver, dependant]
        - name: status
          in: query
          description: "`missing`: at least one consent isn't active. `complete`: every consent is."
          schema:
            type: string
            enum: [missing, complete]
      responses:
        '200':
          description: The register.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsentRegisterRow'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/terms:
    get:
      tags: [Compliance]
      summary: Who has accepted each app's current terms and privacy notice
      operationId: getComplianceTermsReport
      responses:
        '200':
          description: One report per app.
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/TermsDocumentReport'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/audit-log:
    get:
      tags: [Compliance]
      summary: The audit trail, newest first
      description: |
        Who did what to which record, and when: every change, every compliance export, and views
        of check-in verification details and each listen to a visit recording. The trail is append-only. `actorUserId`
        is null for the system (a scheduled job).
      operationId: listAuditLog
      parameters:
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          description: A parameter is malformed, or the period runs backwards or covers more than 366 days.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/audit-log/facets:
    get:
      tags: [Compliance]
      summary: The distinct actions and record types in the audit trail, for filter menus
      operationId: getAuditLogFacets
      responses:
        '200':
          description: The facets.
          content:
            application/json:
              schema:
                type: object
                required: [actions, entityTypes]
                properties:
                  actions:
                    type: array
                    items:
                      type: string
                  entityTypes:
                    type: array
                    items:
                      type: string
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /compliance/exports/{report}:
    get:
      tags: [Compliance]
      summary: Download a compliance report as CSV
      description: |
        `visits` (one row per visit in the period), `visit-summary` (per person, with a totals
        row; takes `groupBy`), `consents`, `terms`, and `audit-log` (takes the audit log's
        filters). Times are Nairobi local time. Text that a spreadsheet would run as a formula is
        prefixed with an apostrophe. Every export is itself recorded in the audit trail.
      operationId: exportComplianceReport
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: string
            enum: [visits, visit-summary, caregiver-performance, consents, terms, audit-log]
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [caregiver, dependant]
            default: caregiver
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The CSV file, as an attachment.
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: A parameter is malformed, or the period runs backwards or covers more than 366 days.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /visit-schedules/{visitScheduleId}/resolutions:
    parameters:
      - $ref: '#/components/parameters/VisitScheduleId'
    post:
      tags: [Compliance]
      summary: Record how an exception was resolved (supervisors only)
      description: |
        Only for a visit that is an exception (see `GET /compliance/exceptions`); otherwise `409`.
        Resolving a missed visit (or one past its end with no check-in that the missed-visit sweep
        hasn't reached) moves it to `investigated`; other visits keep their status. The visit's
        open missed-visit alert, if any, is acknowledged by the same supervisor. Resolutions are
        append-only: resolving again adds a newer one that supersedes the earlier.
      operationId: createVisitResolution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome:
                  $ref: '#/components/schemas/VisitResolutionOutcome'
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Required; surrounding whitespace is trimmed.
      responses:
        '201':
          description: The resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitResolution'
        '400':
          description: The outcome isn't one of the allowed values, or the note is blank.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller isn't a supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The visit has nothing to resolve.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /family-link-requests:
    post:
      tags: [Family Link Requests]
      summary: Ask a primary contact to link you
      description: |
        Family members only. `contact` is the primary contact's exact email or E.164 phone number.
        The answer is always the same `202`, whoever the contact is: the request is stored and
        listed back to the requester as pending either way, and it only reaches anyone if the
        contact belonged to a dependant's primary contact at the time. So this can't be used to
        find out who is registered. Asking again while a request to the same contact is open
        doesn't create another.
      operationId: createFamilyLinkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              properties:
                contact:
                  type: string
                  description: Email address or E.164 phone number.
                relationship:
                  type: string
                  description: The requester's relationship to the dependant(s), e.g. Grandson.
      responses:
        '202':
          description: Accepted (the same answer whether or not the contact matched anyone).
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Family Link Requests]
      summary: Requests to you, and your own requests
      description: |
        `incoming`: open requests addressed to the caller as a primary contact, with who is asking
        and which of the caller's active dependants they could be linked to (`alreadyLinked` marks
        ones they already are). `outgoing`: every request the caller has made; a decided one the
        caller hasn't seen yet has `unread: true` (the app's in-app notification).
      operationId: listFamilyLinkRequests
      responses:
        '200':
          description: Incoming and outgoing requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyLinkRequests'
        default:
          $ref: '#/components/responses/Problem'

  /family-link-requests/{requestId}/approve:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Family Link Requests]
      summary: Approve a request, linking the requester to chosen dependants
      description: Only the primary contact the request was sent to, and only for dependants they are still the primary contact of. Links are made with the requester's stated relationship, not as primary contact.
      operationId: approveFamilyLinkRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependantIds]
              properties:
                dependantIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Approved and linked.
        '403':
          description: A chosen dependant isn't one the caller is the primary contact of.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already answered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /family-link-requests/{requestId}/reject:
    parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Family Link Requests]
      summary: Reject a request
      operationId: rejectFamilyLinkRequest
      responses:
        '200':
          description: Rejected.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already answered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /family-link-requests/outcomes/seen:
    post:
      tags: [Family Link Requests]
      summary: Mark your decided requests as seen
      description: Clears `unread` on the caller's approved and rejected requests (the app calls this when its notifications sheet is opened).
      operationId: markFamilyLinkOutcomesSeen
      responses:
        '204':
          description: Marked as seen.
        default:
          $ref: '#/components/responses/Problem'

  /terms/current:
    get:
      tags: [Terms]
      summary: Get the current terms for the caller's app
      description: |
        The current terms of use and privacy notice for the caller's role (`caregiver` or
        `family_member`; supervisors have none), and whether the caller has accepted this exact
        version. The mobile apps show a consent screen that can't be dismissed until it's accepted.
        Publishing a new `version` asks every user of that app to accept again.
      operationId: getCurrentTerms
      responses:
        '200':
          description: The current document and the caller's acceptance of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTerms'
        '403':
          description: The caller has no users row yet (a family member must finish registering first).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: There are no app terms for the caller's role (supervisor).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /terms/current/accept:
    post:
      tags: [Terms]
      summary: Accept the current terms
      description: |
        Records the caller's acceptance of the version they were shown, with the consent screen's two
        required consents. Idempotent: accepting again keeps the original acceptance time
        (acceptances are append-only).

        Also records the matching consent records (`location_verification` and
        `visit_audio`), skipping any already active: for a caregiver, for
        themselves; for a family member, for each active dependant they are the primary contact
        of. Dependants a consenting family member registers later get the same consent at
        registration.
      operationId: acceptCurrentTerms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, locationConsent, audioConsent, voiceConsent]
              properties:
                version:
                  type: string
                  description: The version the user was shown; must be the current one.
                locationConsent:
                  type: boolean
                  enum: [true]
                  description: Consent to location being checked at each visit. Must be true.
                voiceConsent:
                  type: boolean
                  enum: [true]
                  description: Terms v4's third box, consent to voice checks.
                audioConsent:
                  type: boolean
                  enum: [true]
                  description: Consent to audio being recorded during visits. Must be true.
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [document, version, acceptedAt]
                properties:
                  document:
                    type: string
                    enum: [caregiver, family_member]
                  version:
                    type: string
                  acceptedAt:
                    type: string
                    format: date-time
        '400':
          description: A consent was missing or not true, or the body was otherwise invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The terms were updated since the app loaded them - the user must review the current version.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /voice-enrollments/me/upload-url:
    post:
      tags: [Voice]
      summary: Get a presigned URL to upload your enrolment recording
      description: The caregiver themselves, with voice-verification consent. About 30 seconds of speech, as `audio/mp4`.
      operationId: enrolOwnVoiceUploadUrl
      responses:
        '201':
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUpload'
        '403':
          $ref: '#/components/responses/Problem'
  /voice-enrollments/me:
    get:
      tags: [Voice]
      summary: Whether the caregiver has enrolled their voice
      operationId: getOwnVoiceEnrolment
      responses:
        '200':
          description: The enrolment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceEnrolmentStatus'
    post:
      tags: [Voice]
      summary: Confirm your enrolment recording, which makes the voiceprint
      description: |
        The voice Lambda makes the voiceprint and deletes the recording. Enrolling again replaces
        the voiceprint and deletes the old one. 422 when too little speech was heard.
      operationId: enrolOwnVoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key:
                  type: string
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceEnrolmentStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /voice-enrollments/dependants/{dependantId}/upload-url:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    post:
      tags: [Voice]
      summary: Get a presigned URL to upload a dependant's enrolment recording
      description: A family member linked to the dependant, with voice-verification consent. About 30 seconds of speech, as `audio/mp4`.
      operationId: enrolDependantVoiceUploadUrl
      responses:
        '201':
          description: The presigned upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUpload'
        '403':
          $ref: '#/components/responses/Problem'
  /voice-enrollments/dependants/{dependantId}:
    parameters:
      - $ref: '#/components/parameters/DependantId'
    get:
      tags: [Voice]
      summary: Whether a dependant's voice is enrolled
      description: Linked family members and supervisors. Never the voiceprint itself.
      operationId: getDependantVoiceEnrolment
      responses:
        '200':
          description: The enrolment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceEnrolmentStatus'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Voice]
      summary: Confirm a dependant's enrolment recording, which makes the voiceprint
      description: |
        The voice Lambda makes the voiceprint and deletes the recording. Enrolling again replaces
        the voiceprint and deletes the old one. 422 when too little speech was heard.
      operationId: enrolDependantVoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key:
                  type: string
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceEnrolmentStatus'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /voice-enrollments/caregivers/{caregiverId}:
    parameters:
      - name: caregiverId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Voice]
      summary: Whether a caregiver's voice is enrolled
      description: Supervisors only. Never the voiceprint itself.
      operationId: getCaregiverVoiceEnrolment
      responses:
        '200':
          description: The enrolment status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceEnrolmentStatus'
        '403':
          $ref: '#/components/responses/Problem'
  /voice-checks:
    get:
      tags: [Voice]
      summary: A person's recordings and their advisory voice checks
      description: |
        Supervisors only, with exactly one of `dependantId` or `caregiverId`. The person's own
        recordings, newest first, up to 50. Each read is audit-logged as `voice_checks.view`.
      operationId: listVoiceChecks
      parameters:
        - name: dependantId
          in: query
          schema:
            type: string
            format: uuid
        - name: caregiverId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The enrolment status and the recordings.
          content:
            application/json:
              schema:
                type: object
                required: [enrolment, items]
                properties:
                  enrolment:
                    $ref: '#/components/schemas/VoiceEnrolmentStatus'
                  items:
                    type: array
                    items:
                      type: object
                      required: [visitScheduleId, scheduledStart, caregiverName, dependantName, recordedAt, durationSeconds, result, score, speechSeconds, threshold]
                      properties:
                        visitScheduleId:
                          type: string
                          format: uuid
                        scheduledStart:
                          type: string
                          format: date-time
                        caregiverName:
                          type: string
                        dependantName:
                          type: string
                        recordedAt:
                          type: string
                          format: date-time
                        durationSeconds:
                          type: integer
                        result:
                          oneOf:
                            - $ref: '#/components/schemas/VoiceCheckResult'
                            - type: 'null'
                        score:
                          type: [number, 'null']
                        speechSeconds:
                          type: [number, 'null']
                        threshold:
                          type: [number, 'null']
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: A caller sees only notifications addressed to them (`recipientUserId`), unless they're a supervisor viewing the missed-visit alert inbox.
      operationId: listNotifications
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/NotificationType'
        - name: acknowledged
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        default:
          $ref: '#/components/responses/Problem'

  /notifications/{notificationId}/acknowledge:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Notifications]
      summary: Acknowledge a notification
      description: Sets `acknowledged_at` / `acknowledged_by`, distinct from the underlying `visit_schedules.status`.
      operationId: acknowledgeNotification
      responses:
        '200':
          description: The acknowledged notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Cognito-issued ID token (not the access token - the `custom:role` custom attribute this API's RBAC relies on is only present in the ID token by default, confirmed against AWS's Cognito documentation; the access token's default claim set does not include custom attributes without a Pre Token Generation Lambda trigger, which this project does not use). The `custom:role` claim drives RBAC.
    checkinSessionToken:
      type: apiKey
      in: header
      name: X-Checkin-Session-Token
      description: |
        The short-lived session token returned by `POST .../checkin/geofence`, required in
        addition to (not instead of) the normal `bearerAuth` Cognito token on every remaining
        check-in step (code scan, supervisor override). Proves this specific
        visit's geofence step was passed recently, not just that the caller is a valid caregiver in
        general - defense in depth, confirmed with the user as the more robust of two designs over
        a session-token-only approach (HEZ-34). A previous draft of this file used
        `security: [{bearerAuth: [sessionToken]}]` on one endpoint only, an ambiguous OAuth2-style
        scopes annotation that doesn't apply to an `http`/`bearer` scheme and was never a
        considered design - superseded by this explicit second scheme, applied consistently to
        every step past the geofence check.

  parameters:
    PeriodFrom:
      name: from
      in: query
      description: First Nairobi day of the period (YYYY-MM-DD). Defaults to the first of this month.
      schema:
        type: string
        format: date
    PeriodTo:
      name: to
      in: query
      description: Last Nairobi day of the period, included (YYYY-MM-DD). Defaults to the last of this month.
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaregiverId:
      name: caregiverId
      in: path
      required: true
      description: Same value as the caregiver's `userId` (shared-PK 1:1 extension of `users`).
      schema:
        type: string
        format: uuid
    DependantId:
      name: dependantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitScheduleId:
      name: visitScheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingRole:
      name: role
      in: path
      required: true
      description: Whose voice the recording is.
      schema:
        type: string
        enum: [caregiver, dependant]
    CareTaskId:
      name: careTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: An error, in RFC 7807 Problem Details format.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unschedulable:
      description: |
        The visit can't be scheduled, or moved to a new time, and `detail` says who is missing
        what. The caregiver or the dependant (or both) has no active (unrevoked)
        `location_verification` consent record, given by
        accepting the terms in the mobile app. Status-only updates (e.g. cancelling) are never
        blocked by this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No resource exists at this location.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with existing state (e.g. a unique constraint).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    VisitStats:
      type: object
      required: [windowDays, visits, completionRate, lastMissedVisitStart, nextVisit, lastVisit]
      properties:
        windowDays:
          type: integer
          description: How many days back `visits` covers (30), ending now.
        visits:
          type: object
          description: |
            Visits that started in the window, by outcome. `missed` includes a visit whose end
            passed with no check-in even before the missed-visit sweep marks it; `open` is one
            under way or checked in but not yet checked out.
          required: [total, completed, missed, cancelled, open]
          properties:
            total: { type: integer }
            completed: { type: integer }
            missed: { type: integer }
            cancelled: { type: integer }
            open: { type: integer }
        completionRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: completed / (completed + missed); null when neither happened in the window.
        lastMissedVisitStart:
          type: [string, 'null']
          format: date-time
          description: When the most recent missed visit in the window was due to start.
        nextVisit:
          description: The next scheduled visit still to come.
          oneOf:
            - $ref: '#/components/schemas/VisitStatsVisit'
            - type: 'null'
        lastVisit:
          description: The most recent visit someone checked in to, however long ago.
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/VisitStatsVisit'
                - type: object
                  required: [checkinAt, checkoutAt]
                  properties:
                    checkinAt: { type: string, format: date-time }
                    checkoutAt: { type: [string, 'null'], format: date-time }
            - type: 'null'
    VisitStatsVisit:
      type: object
      required:
        [id, scheduledStart, scheduledEnd, caregiverId, caregiverName, dependantId, dependantName]
      properties:
        id: { type: string, format: uuid }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        caregiverId: { type: string, format: uuid }
        caregiverName: { type: string }
        dependantId: { type: string, format: uuid }
        dependantName: { type: string }
    DashboardOverview:
      type: object
      required: [date, timeZone, generatedAt, visits, trend, previousPeriod, attention]
      properties:
        date: { type: string, format: date }
        timeZone: { type: string, example: Africa/Nairobi }
        generatedAt: { type: string, format: date-time }
        visits:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              state: { type: string, enum: [upcoming, awaiting_checkin, checked_in, no_checkin] }
              status: { type: string }
              scheduledStart: { type: string, format: date-time }
              scheduledEnd: { type: string, format: date-time }
              checkinAt: { type: [string, 'null'], format: date-time }
              checkoutAt: { type: [string, 'null'], format: date-time }
              caregiver:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  fullName: { type: string }
                  phoneNumber: { type: string }
              dependant:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  fullName: { type: string }
                  lat: { type: number }
                  lng: { type: number }
        trend:
          type: array
          description: 14 days, oldest first. `open` is visits not yet completed or missed.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              completed: { type: integer }
              missed: { type: integer }
              cancelled: { type: integer }
              open: { type: integer }
        previousPeriod:
          type: object
          description: Completed and missed visits in the 14 days before `trend`, so a client can compare completion rates.
          properties:
            completed: { type: integer }
            missed: { type: integer }
        attention:
          type: object
          properties:
            missedVisitAlerts:
              type: object
              description: Unacknowledged missed-visit alerts, newest first; `items` holds up to 100.
              properties:
                total: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      sentAt: { type: [string, 'null'], format: date-time }
                      visitScheduleId: { type: string, format: uuid }
                      scheduledStart: { type: string, format: date-time }
                      dependantName: { type: string }
                      caregiverName: { type: string }
            visitsNeedingCover:
              type: object
              description: Late visits still looking for cover, or where nobody could be found.
              properties:
                total: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      caseId: { type: string, format: uuid }
                      status: { type: string, enum: [open, exhausted] }
                      visitScheduleId: { type: string, format: uuid }
                      scheduledStart: { type: string, format: date-time }
                      dependantName: { type: string }
                      caregiverName: { type: string }
                      offeredToName: { type: [string, 'null'] }
                      notificationId: { type: [string, 'null'], format: uuid }
            pendingCheckinOverrides:
              type: object
              description: Caregivers at a home waiting for a supervisor to start the visit; `items` holds up to 100, oldest first.
              properties:
                total: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      visitScheduleId: { type: string, format: uuid }
                      reason:
                        $ref: '#/components/schemas/CheckinOverrideReason'
                      note: { type: [string, 'null'] }
                      requestedAt: { type: string, format: date-time }
                      dependantName: { type: string }
                      caregiverName: { type: string }
    FamilyLinkRequests:
      type: object
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items:
            type: object
            required: [id, requester, relationship, createdAt, dependants]
            properties:
              id: { type: string, format: uuid }
              requester:
                type: object
                properties:
                  fullName: { type: string }
                  email: { type: [string, 'null'] }
                  phoneNumber: { type: [string, 'null'] }
              relationship: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              dependants:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    fullName: { type: string }
                    alreadyLinked: { type: boolean }
        outgoing:
          type: array
          items:
            type: object
            required: [id, targetContact, status, createdAt, decidedAt, unread, linkedDependants]
            properties:
              id: { type: string, format: uuid }
              targetContact: { type: string }
              relationship: { type: [string, 'null'] }
              status: { type: string, enum: [pending, approved, rejected] }
              createdAt: { type: string, format: date-time }
              decidedAt: { type: [string, 'null'], format: date-time }
              unread: { type: boolean }
              linkedDependants:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    fullName: { type: string }
    CurrentTerms:
      type: object
      required: [document, version, title, effectiveDate, sections, acceptedAt]
      properties:
        document:
          type: string
          enum: [caregiver, family_member]
        version:
          type: string
        title:
          type: string
        effectiveDate:
          type: string
          format: date
        sections:
          type: array
          items:
            type: object
            required: [heading, paragraphs]
            properties:
              heading:
                type: string
              paragraphs:
                type: array
                items:
                  type: string
        acceptedAt:
          type: [string, 'null']
          format: date-time
          description: When the caller accepted this exact version, or null if they haven't.
    Problem:
      type: object
      description: RFC 7807 Problem Details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: A URI identifying the problem type. `about:blank` when there's no more specific type.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        failureReason:
          type: string
          description: Present on some error responses (e.g. GeofenceCheckinFailureReason on the geofence check's 422) so a client can branch deterministically instead of parsing `detail`'s prose.

    UserRole:
      type: string
      enum: [supervisor, caregiver, family_member]
    UserStatus:
      type: string
      enum: [active, suspended, deactivated]
    DependantStatus:
      type: string
      enum: [active, deactivated]
    # Renamed from DependantGender (2026-09-22, HEZ-54) - caregivers now use the same enum, per
    # backend/src/db/schema.ts's own person_gender rename.
    PersonGender:
      type: string
      enum: [male, female]
    CaregiverOccupation:
      type: string
      enum: [nurse, community_health_worker, caregiver]
    IdType:
      type: string
      enum: [national_id, passport]
    SubjectType:
      type: string
      enum: [caregiver, dependant]
    VisitStatus:
      type: string
      enum: [scheduled, in_progress, completed, missed, cancelled, investigated, reassigned]
    VerificationAttemptType:
      type: string
      enum: [geofence, family_location, qr_scan, checkout_qr, checkout_code]
    ConsentType:
      type: string
      enum: [location_verification, visit_audio, voice_verification]
    NotificationType:
      type: string
      enum: [missed_visit, checkin_override, no_cover_found]

    User:
      type: object
      required: [id, cognitoSub, fullName, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        cognitoSub:
          type: string
          description: "Not secret - already visible to the caller via their own decoded JWT for a self-view; needed by a supervisor's search-by-email/phone flow to link an existing identity."
        email:
          type: [string, 'null']
          format: email
        phoneNumber:
          type: [string, 'null']
          description: 'Nullable only for `role: supervisor` (`chk_users_phone_required_unless_supervisor`).'
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [cognitoSub, fullName, role]
      properties:
        cognitoSub:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [supervisor, family_member]
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        fullName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: [string, 'null']

    Caregiver:
      type: object
      required: [userId, active, createdAt, updatedAt]
      properties:
        baseLat:
          type: [number, 'null']
          format: double
          description: Where a planned route starts. Given together with baseLng.
        baseLng:
          type: [number, 'null']
          format: double
        baseAreaText:
          type: [string, 'null']
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: [string, 'null']
          format: email
        phoneNumber:
          type: [string, 'null']
        idType:
          oneOf:
            - $ref: '#/components/schemas/IdType'
            - type: 'null'
        idNumber:
          type: [string, 'null']
        dob:
          type: [string, 'null']
          format: date
        gender:
          oneOf:
            - $ref: '#/components/schemas/PersonGender'
            - type: 'null'
        occupation:
          oneOf:
            - $ref: '#/components/schemas/CaregiverOccupation'
            - type: 'null'
        employeeNumber:
          type: [string, 'null']
          description: >-
            Auto-generated at registration ('CG-' plus a zero-padded sequence value, e.g.
            CG-0001), never client-supplied - see CreateCaregiverRequest. Still editable later via
            UpdateCaregiverRequest if a supervisor ever needs to correct one by hand.
        hireDate:
          type: [string, 'null']
          format: date
          description: 'Auto-populated to the actual registration date, never client-supplied - see CreateCaregiverRequest.'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCaregiverRequest:
      type: object
      description: >-
        employeeNumber/hireDate are deliberately absent here (2026-09-22, HEZ-54) - both are
        DB-generated at registration, not supervisor-entered. Creates a brand-new Cognito identity
        itself (like AddFamilyMemberRequest's email path) - a caregiver never self-registers, so a
        pre-existing Cognito account can never be assumed.
      required: [fullName, email, phoneNumber, idType, idNumber, dob, gender, occupation]
      properties:
        baseLat:
          type: number
          format: double
          description: Where a planned route starts. Given together with baseLng.
        baseLng:
          type: number
          format: double
        baseAreaText:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: E.164, e.g. +254712345678. Cognito accepts no other format.
        idType:
          $ref: '#/components/schemas/IdType'
        idNumber:
          type: string
        dob:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/PersonGender'
        occupation:
          $ref: '#/components/schemas/CaregiverOccupation'
    UpdateCaregiverRequest:
      type: object
      properties:
        baseLat:
          type: number
          format: double
          description: Where a planned route starts. Given together with baseLng.
        baseLng:
          type: number
          format: double
        baseAreaText:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: E.164, e.g. +254712345678. Cognito accepts no other format.
        idType:
          $ref: '#/components/schemas/IdType'
        idNumber:
          type: string
        dob:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/PersonGender'
        occupation:
          $ref: '#/components/schemas/CaregiverOccupation'
        employeeNumber:
          type: string
        hireDate:
          type: string
          format: date
        active:
          type: boolean
    CaregiverPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Caregiver'
        nextCursor:
          type: [string, 'null']

    Dependant:
      type: object
      required:
        - id
        - fullName
        - dob
        - geofenceLat
        - geofenceLng
        - geofenceRadiusMeters
        - status
        - registeredBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        dob:
          type: string
          format: date
        gender:
          oneOf:
            - $ref: '#/components/schemas/PersonGender'
            - type: 'null'
        homeAddressText:
          type: [string, 'null']
        primaryConditionSummary:
          description: Free-text clinical/care context for caregivers/supervisors - not a structured diagnosis field.
          type: [string, 'null']
        county:
          description: Resolved client-side (admin web app) via a point-in-polygon lookup against IEBC ward boundary GeoJSON as the geofence pin is placed. Null for dependants registered before this field existed.
          type: [string, 'null']
        constituency:
          type: [string, 'null']
        ward:
          type: [string, 'null']
        geofenceLat:
          type: number
          format: double
        geofenceLng:
          type: number
          format: double
        geofenceRadiusMeters:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DependantStatus'
        registeredBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDependantRequest:
      type: object
      required:
        [
          fullName,
          dob,
          county,
          constituency,
          ward,
          geofenceLat,
          geofenceLng,
          geofenceRadiusMeters,
          primaryFamilyMember,
        ]
      properties:
        fullName:
          type: string
        dob:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/PersonGender'
        homeAddressText:
          type: string
        primaryConditionSummary:
          type: string
        county:
          description: Required for every new registration, unlike homeAddressText's own optional free-text treatment - resolved client-side as the geofence pin is placed.
          type: string
        constituency:
          type: string
        ward:
          type: string
        geofenceLat:
          type: number
          format: double
        geofenceLng:
          type: number
          format: double
        geofenceRadiusMeters:
          type: integer
          minimum: 1
        primaryFamilyMember:
          $ref: '#/components/schemas/AddFamilyMemberRequest'
    UpdateDependantRequest:
      type: object
      properties:
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/PersonGender'
        homeAddressText:
          type: string
        primaryConditionSummary:
          type: string
        county:
          type: string
        constituency:
          type: string
        ward:
          type: string
        geofenceLat:
          type: number
          format: double
        geofenceLng:
          type: number
          format: double
        geofenceRadiusMeters:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/DependantStatus'
    DependantPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dependant'
        nextCursor:
          type: [string, 'null']

    DependantFamilyMember:
      type: object
      description: |
        A family member's link to a dependant, with their registration details. Email and phone
        are returned to anyone who can see the list (other family members of the same dependant
        use them to coordinate care). `idType`/`idNumber` are returned to supervisors only and are
        absent from a family member's response altogether, since a national ID number is
        sensitive and another family member has no need for it.
      required:
        [
          dependantId,
          familyMemberUserId,
          fullName,
          isPrimaryContact,
          addedBy,
          createdAt,
          email,
          phoneNumber,
          addedByName,
        ]
      properties:
        dependantId:
          type: string
          format: uuid
        familyMemberUserId:
          type: string
          format: uuid
        fullName:
          type: string
          description: The linked member's own name, so a family member can see who the other members are without access to `GET /users/{userId}`.
        relationship:
          type: [string, 'null']
        isPrimaryContact:
          type: boolean
        addedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          description: When the link was made.
        email:
          type: [string, 'null']
        phoneNumber:
          type: [string, 'null']
        addedByName:
          type: [string, 'null']
          description: The name of the person who linked this member (a supervisor or the primary contact).
        idType:
          type: [string, 'null']
          enum: [national_id, passport, null]
          description: Supervisors only.
        idNumber:
          type: [string, 'null']
          description: Supervisors only.
    AddFamilyMemberRequest:
      type: object
      description: |
        Exactly one of `cognitoSub` or `email` must be provided (a plain JSON Schema `required`
        list can't express this conditional constraint - enforced server-side via zod, matching
        `CreateUserRequest`'s phone-required-unless-supervisor precedent elsewhere in this spec).
        `cognitoSub` links an identity that already exists in Cognito; if that identity doesn't
        have a `users` row yet, one is created with `role: family_member`. `email` creates a
        brand-new Cognito identity from scratch for someone who has never signed up or been
        created before - a real invitation email is sent with a Cognito-generated temporary
        password.
      required: [phoneNumber, fullName]
      properties:
        cognitoSub:
          type: string
          description: 'Links an existing Cognito identity. Mutually exclusive with email.'
        email:
          type: string
          format: email
          description: 'Creates a brand-new Cognito identity and sends it a real invitation email. Mutually exclusive with cognitoSub.'
        phoneNumber:
          type: string
          description: >-
            Required in E.164 format (e.g. +254712345678) only when email is also set - that's the
            only path that sends this value to Cognito's AdminCreateUser, which rejects any other
            format. Not validated against this format when cognitoSub is set instead (linking an
            existing identity never uses this field).
        fullName:
          type: string
        idType:
          allOf: [{ $ref: '#/components/schemas/IdType' }]
          description: 'Required together with idNumber when registering a brand-new user via email.'
        idNumber:
          type: string
          description: 'Required together with idType when registering a brand-new user via email.'
        relationship:
          type: string
        isPrimaryContact:
          type: boolean
          default: false
    UpdateFamilyMemberRequest:
      type: object
      properties:
        relationship:
          type: string
        isPrimaryContact:
          type: boolean

    TaskCompletionStatus:
      type: string
      enum: [completed, not_completed, not_applicable]
    TaskSkipReason:
      type: string
      enum: [client_declined, client_unavailable, equipment_unavailable, other]
    CareTask:
      type: object
      description: A care-plan task (docs/visit-task-checklist-plan.md), authored by a supervisor for one dependant.
      required: [id, dependantId, title, required, active, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        dependantId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          description: Free text, not a fixed ADL/IADL taxonomy - a display grouping label only.
        required:
          type: boolean
          description: A required task with no visit_task_completions row blocks checkout for that visit.
        active:
          type: boolean
          description: A retired (false) task keeps its history but stops appearing on future visits.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCareTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        required:
          type: boolean
          default: true
    UpdateCareTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        required:
          type: boolean
        active:
          type: boolean
    VisitTask:
      type: object
      description: A care-plan task live-joined against this visit's own completion, if any has been recorded yet.
      required: [careTaskId, title, required, status, reason, notes, completedAt]
      properties:
        careTaskId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
        required:
          type: boolean
        status:
          oneOf: [{ $ref: '#/components/schemas/TaskCompletionStatus' }, { type: 'null' }]
          description: 'Null: not yet addressed this visit.'
        reason:
          oneOf: [{ $ref: '#/components/schemas/TaskSkipReason' }, { type: 'null' }]
        notes:
          type: [string, 'null']
        completedAt:
          type: [string, 'null']
          format: date-time
    VisitTaskOutcome:
      type: object
      description: One recorded care-task outcome for a visit.
      required: [careTaskId, title, required, status, reason, notes, completedAt]
      properties:
        careTaskId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
        required:
          type: boolean
        status:
          $ref: '#/components/schemas/TaskCompletionStatus'
        reason:
          oneOf: [{ $ref: '#/components/schemas/TaskSkipReason' }, { type: 'null' }]
          description: 'Set only when status is not_completed.'
        notes:
          type: [string, 'null']
        completedAt:
          type: string
          format: date-time
    PutVisitTaskCompletionRequest:
      type: object
      description: "`reason` is required when `status` is `not_completed`, and must be omitted otherwise (matches `visit_task_completions`'s own CHECK constraint)."
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskCompletionStatus'
        reason:
          $ref: '#/components/schemas/TaskSkipReason'
        notes:
          type: string

    PresignedUpload:
      type: object
      required: [uploadUrl, s3Key, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        s3Key:
          type: string
        expiresAt:
          type: string
          format: date-time
    VisitSchedule:
      type: object
      required:
        [
          id,
          caregiverId,
          dependantId,
          caregiverDisplayName,
          dependantDisplayName,
          scheduledStart,
          scheduledEnd,
          status,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        caregiverId:
          type: string
          format: uuid
        dependantId:
          type: string
          format: uuid
        caregiverDisplayName:
          type: string
          description: Added for HEZ-66 - every consumer of this endpoint needed a display name per visit and had no other way to get one (a caregiver in particular has no access to GET /dependants at all).
        dependantDisplayName:
          type: string
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/VisitStatus'
        routeSequence:
          type: [integer, 'null']
          description: This visit's place in its planned route, when it came from a published plan.
        recoveredFromVisitId:
          type: [string, 'null']
          format: uuid
          description: The visit this one replaced, when another caregiver took it over.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateVisitScheduleRequest:
      type: object
      required: [caregiverId, dependantId, scheduledStart, scheduledEnd]
      properties:
        caregiverId:
          type: string
          format: uuid
        dependantId:
          type: string
          format: uuid
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
    UpdateVisitScheduleRequest:
      type: object
      properties:
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/VisitStatus'
    VisitSchedulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VisitSchedule'
        nextCursor:
          type: [string, 'null']

    VerificationEvent:
      type: object
      required: [visitScheduleId]
      properties:
        visitScheduleId:
          type: string
          format: uuid
        checkinAt:
          type: [string, 'null']
          format: date-time
        checkoutAt:
          type: [string, 'null']
          format: date-time
        checkinGpsLat:
          type: [number, 'null']
          format: double
        checkinGpsLng:
          type: [number, 'null']
          format: double
        distanceFromGeofenceMeters:
          type: [number, 'null']
          format: double
        checkoutGpsLat:
          type: [number, 'null']
          format: double
          description: Where the caregiver checked out. Null before checkout, and for visits checked out before checkout locations were recorded.
        checkoutGpsLng:
          type: [number, 'null']
          format: double
        checkoutDistanceFromGeofenceMeters:
          type: [number, 'null']
          format: double
        checkinMethod:
          oneOf:
            - $ref: '#/components/schemas/CheckinMethod'
            - type: 'null'
        qrFamilyMemberName:
          type: [string, 'null']
          description: The family member whose code was scanned.
        familyDistanceFromGeofenceMeters:
          type: [number, 'null']
          format: double
        audioRecordedAt:
          type: [string, 'null']
          format: date-time
        audioDurationSeconds:
          type: [integer, 'null']
        audioSkipReason:
          oneOf:
            - $ref: '#/components/schemas/AudioSkipReason'
            - type: 'null'
        audioSkipNote:
          type: [string, 'null']
        recordings:
          type: array
          description: Both recordings. `voiceCheck` is included for supervisors only.
          items:
            type: object
            required: [role, recordedAt, durationSeconds]
            properties:
              role:
                type: string
                enum: [caregiver, dependant]
              recordedAt:
                type: string
                format: date-time
              durationSeconds:
                type: integer
              voiceCheck:
                oneOf:
                  - $ref: '#/components/schemas/VoiceCheck'
                  - type: 'null'
        checkoutRequestedAt:
          type: [string, 'null']
          format: date-time
        checkoutMethod:
          type: [string, 'null']
          enum: [qr, code, override, null]
        checkoutFamilyMemberName:
          type: [string, 'null']
        checkoutOverrideReason:
          oneOf:
            - $ref: '#/components/schemas/CheckoutOverrideReason'
            - type: 'null'
        checkoutOverrideNote:
          type: [string, 'null']
    VoiceCheck:
      type: object
      description: Advisory. A score exists only for match or mismatch.
      required: [result, score, speechSeconds, threshold, checkedAt]
      properties:
        result:
          $ref: '#/components/schemas/VoiceCheckResult'
        score:
          type: [number, 'null']
          description: Cosine similarity to the claimed person's voiceprint; a match is at or above `threshold`.
        speechSeconds:
          type: [number, 'null']
        threshold:
          type: [number, 'null']
        checkedAt:
          type: string
          format: date-time
    VoiceCheckResult:
      type: string
      enum: [match, mismatch, too_short, not_enrolled, no_consent, unavailable]
    VoiceEnrolmentStatus:
      type: object
      required: [enrolled, enrolledAt]
      properties:
        enrolled:
          type: boolean
        enrolledAt:
          type: [string, 'null']
          format: date-time
        speechSeconds:
          type: [number, 'null']
    RecordingRequirement:
      type: object
      required: [required, recorded]
      properties:
        required:
          type: boolean
          description: That person has visit-audio consent.
        recorded:
          type: boolean
    CheckoutOverrideReason:
      type: string
      enum: [no_family_member_present, family_phone_unavailable, camera_or_code_problem, other]
    VerificationAttempt:
      type: object
      required: [id, visitScheduleId, attemptType, passed, attemptedAt]
      properties:
        id:
          type: string
          format: uuid
        visitScheduleId:
          type: string
          format: uuid
        attemptType:
          $ref: '#/components/schemas/VerificationAttemptType'
        passed:
          type: boolean
        failureReason:
          type: [string, 'null']
        attemptedAt:
          type: string
          format: date-time
    VerificationAudit:
      type: object
      required: [event, attempts]
      properties:
        event:
          description: Null when the visit has never reached the geofence step (no verification_events row exists yet).
          oneOf:
            - $ref: '#/components/schemas/VerificationEvent'
            - type: 'null'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/VerificationAttempt'
        exceptionKinds:
          type: array
          description: Supervisors only. Why the visit is an exception (empty when it isn't); see `GET /compliance/exceptions`.
          items:
            $ref: '#/components/schemas/ExceptionKind'
        resolutions:
          type: array
          description: Supervisors only. How the exception was resolved, newest first; the first is the one in force.
          items:
            $ref: '#/components/schemas/VisitResolution'

    GeofenceCheckinRequest:
      type: object
      required: [gpsLat, gpsLng, accuracyMeters, isMockLocation]
      properties:
        gpsLat:
          type: number
          format: double
        gpsLng:
          type: number
          format: double
        accuracyMeters:
          type: number
          format: double
        isMockLocation:
          type: boolean
          description: The Android mock-location flag; a `true` value is always rejected.
    GeofenceCheckinResult:
      type: object
      required: [sessionToken, distanceFromGeofenceMeters, expiresAt]
      properties:
        sessionToken:
          type: string
          description: Short-lived bearer token scoping the rest of check-in. Stored server-side only as a hash.
        distanceFromGeofenceMeters:
          type: number
          format: double
        expiresAt:
          type: string
          format: date-time
    CheckinContext:
      type: object
      required:
        [
          dependantDisplayName,
          dependantHomeAddressText,
          geofenceLat,
          geofenceLng,
          geofenceRadiusMeters,
        ]
      properties:
        dependantDisplayName:
          type: string
        dependantHomeAddressText:
          type: [string, 'null']
        geofenceLat:
          type: number
          format: double
        geofenceLng:
          type: number
          format: double
        geofenceRadiusMeters:
          type: integer

    ConsentRecord:
      type: object
      required: [id, subjectType, consentType, grantedBy, grantedAt]
      properties:
        id:
          type: string
          format: uuid
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        caregiverId:
          type: [string, 'null']
          format: uuid
        dependantId:
          type: [string, 'null']
          format: uuid
        consentType:
          $ref: '#/components/schemas/ConsentType'
        grantedBy:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    CreateConsentRecordRequest:
      type: object
      required: [subjectType, subjectId, consentType]
      properties:
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
          format: uuid
        consentType:
          $ref: '#/components/schemas/ConsentType'

    CheckinCode:
      type: object
      required: [token, expiresAt, caregiverDisplayName]
      properties:
        token:
          type: string
          description: The value to encode in the QR code. Opaque and holds no personal data.
        code:
          type: string
          pattern: '^\d{6}$'
          description: Check-out codes only. The 6 digits shown under the QR code, for typing.
        expiresAt:
          type: string
          format: date-time
        caregiverDisplayName:
          type: string
    CheckinOverrideReason:
      type: string
      enum: [no_family_member_present, family_phone_unavailable, network_problem, other]
    CheckinOverrideStatus:
      type: string
      enum: [pending, approved, denied]
    AudioSkipReason:
      type: string
      enum: [dependant_declined, dependant_unwell_or_asleep, technical_problem, other]
    CheckinMethod:
      type: string
      enum: [qr, supervisor_override]
    CheckinOverride:
      type: object
      required: [id, visitScheduleId, reason, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        visitScheduleId: { type: string, format: uuid }
        reason:
          $ref: '#/components/schemas/CheckinOverrideReason'
        note: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/CheckinOverrideStatus'
        decisionNote: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    CheckinOverrideListItem:
      allOf:
        - $ref: '#/components/schemas/CheckinOverride'
        - type: object
          required: [scheduledStart, scheduledEnd, dependantName, caregiverName, distanceFromGeofenceMeters]
          properties:
            scheduledStart: { type: string, format: date-time }
            scheduledEnd: { type: string, format: date-time }
            dependantName: { type: string }
            caregiverName: { type: string }
            distanceFromGeofenceMeters: { type: number, format: double }
    CheckinOverrideDecision:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
    VisitPlan:
      type: object
      required: [id, date, shiftStart, shiftEnd, visitMinutes, status, clusters, unplaced, excludedCaregivers]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        shiftStart: { type: string }
        shiftEnd: { type: string }
        visitMinutes: { type: integer }
        status: { type: string, enum: [draft, published] }
        publishedAt: { type: [string, 'null'], format: date-time }
        clusters:
          type: array
          items:
            type: object
            required: [id, caregiverId, caregiverName, base, totalDistanceMeters, totalTravelMinutes, stops]
            properties:
              id: { type: string, format: uuid }
              caregiverId: { type: string, format: uuid }
              caregiverName: { type: string }
              base:
                type: object
                properties:
                  lat: { type: [number, 'null'] }
                  lng: { type: [number, 'null'] }
              totalDistanceMeters: { type: integer }
              totalTravelMinutes: { type: integer }
              stops:
                type: array
                items:
                  type: object
                  required: [dependantId, dependantName, scheduledStart, scheduledEnd, travelMinutes, distanceMeters]
                  properties:
                    dependantId: { type: string, format: uuid }
                    dependantName: { type: string }
                    lat: { type: [number, 'null'] }
                    lng: { type: [number, 'null'] }
                    ward: { type: [string, 'null'] }
                    scheduledStart: { type: string, format: date-time }
                    scheduledEnd: { type: string, format: date-time }
                    travelMinutes: { type: integer }
                    distanceMeters: { type: integer }
        unplaced:
          type: array
          items:
            type: object
            required: [dependantId, dependantName, reason]
            properties:
              dependantId: { type: string, format: uuid }
              dependantName: { type: string }
              reason: { type: string, enum: [already_scheduled, no_consent, shift_full] }
        excludedCaregivers:
          type: array
          items:
            type: object
            required: [caregiverId, caregiverName, reason]
            properties:
              caregiverId: { type: string, format: uuid }
              caregiverName: { type: string }
              reason: { type: string, enum: [already_scheduled, no_consent, no_home_base] }
    CaregiverPerformanceRow:
      type: object
      required: [caregiverId, caregiverName, assigned, completed, missed, excused, weeks]
      properties:
        caregiverId: { type: string, format: uuid }
        caregiverName: { type: string }
        assigned: { type: integer }
        completed: { type: integer }
        missed: { type: integer }
        excused: { type: integer }
        completionRate: { type: [number, 'null'] }
        checkedIn: { type: integer }
        onTimeRate: { type: [number, 'null'] }
        averageCheckinDelayMinutes: { type: [number, 'null'] }
        averageVisitMinutes: { type: [number, 'null'] }
        averagePlannedMinutes: { type: [number, 'null'] }
        requiredTasksDoneRate: { type: [number, 'null'] }
        qrVerifiedRate: { type: [number, 'null'] }
        supervisorOverrides: { type: integer }
        failedCheckins: { type: integer }
        recordingsProvided: { type: integer }
        recordingsSkipped:
          type: object
          additionalProperties: { type: integer }
        offersReceived: { type: integer }
        offersAccepted: { type: integer }
        offersDeclined: { type: integer }
        offersExpired: { type: integer }
        averageOfferResponseMinutes: { type: [number, 'null'] }
        visitsCovered: { type: integer }
        weeks:
          type: array
          items:
            type: object
            required: [weekStart, completed, missed, onTime, checkedIn]
            properties:
              weekStart: { type: string, format: date }
              completed: { type: integer }
              missed: { type: integer }
              onTime: { type: integer }
              checkedIn: { type: integer }
    Period:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    VisitSummaryCounts:
      type: object
      required:
        [
          total,
          completed,
          missed,
          cancelled,
          open,
          investigated,
          fullyVerified,
          late,
          missingCheckout,
          requiredTasksNotDone,
          completionRate,
          verifiedRate,
        ]
      properties:
        total:
          type: integer
          description: Every visit that started in the period, cancelled ones included.
        completed:
          type: integer
        missed:
          type: integer
        cancelled:
          type: integer
        open:
          type: integer
          description: Not decided yet, or checked in with no checkout.
        investigated:
          type: integer
          description: Missed visits a supervisor has resolved.
        fullyVerified:
          type: integer
        late:
          type: integer
        missingCheckout:
          type: integer
        requiredTasksNotDone:
          type: integer
        completionRate:
          type: [number, 'null']
          description: completed / (completed + missed).
        verifiedRate:
          type: [number, 'null']
          description: fullyVerified / completed.
    ComplianceVisitSummary:
      type: object
      required: [period, groupBy, rows, totals]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        groupBy:
          type: string
          enum: [caregiver, dependant]
        rows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VisitSummaryCounts'
              - type: object
                required: [personId, personName]
                properties:
                  personId:
                    type: string
                    format: uuid
                  personName:
                    type: string
        totals:
          $ref: '#/components/schemas/VisitSummaryCounts'
    ExceptionKind:
      type: string
      enum: [missed, missing_checkout, failed_check, supervisor_override, checkout_override]
    VisitResolutionOutcome:
      type: string
      enum:
        [
          caregiver_absent,
          family_cancelled,
          dependant_unavailable,
          device_or_network_issue,
          visit_took_place,
          verified_manually,
          other,
        ]
    VisitResolution:
      type: object
      required: [id, visitScheduleId, outcome, note, resolvedBy, resolvedByName, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        visitScheduleId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/VisitResolutionOutcome'
        note:
          type: string
        resolvedBy:
          type: string
          format: uuid
        resolvedByName:
          type: string
        resolvedAt:
          type: string
          format: date-time
    ComplianceException:
      type: object
      required:
        [
          visitScheduleId,
          scheduledStart,
          scheduledEnd,
          status,
          caregiverId,
          caregiverName,
          dependantId,
          dependantName,
          checkinAt,
          checkoutAt,
          kinds,
          failedChecks,
          latestResolution,
        ]
      properties:
        visitScheduleId:
          type: string
          format: uuid
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        status:
          type: string
        caregiverId:
          type: string
          format: uuid
        caregiverName:
          type: string
        dependantId:
          type: string
          format: uuid
        dependantName:
          type: string
        checkinAt:
          type: [string, 'null']
          format: date-time
        checkoutAt:
          type: [string, 'null']
          format: date-time
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionKind'
        failedChecks:
          type: array
          items:
            type: object
            required: [attemptType, failureReason, count]
            properties:
              attemptType:
                type: string
              failureReason:
                type: [string, 'null']
              count:
                type: integer
        latestResolution:
          oneOf:
            - type: 'null'
            - type: object
              required: [outcome, note, resolvedByName, resolvedAt]
              properties:
                outcome:
                  $ref: '#/components/schemas/VisitResolutionOutcome'
                note:
                  type: string
                resolvedByName:
                  type: string
                resolvedAt:
                  type: string
                  format: date-time
    ComplianceExceptionPage:
      type: object
      required: [period, total, items]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        total:
          type: integer
          description: How many exceptions match, across every page.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceException'
        nextCursor:
          type: [string, 'null']
    ComplianceAlertResponse:
      type: object
      required:
        [
          period,
          raised,
          acknowledged,
          unacknowledged,
          medianMinutesToAcknowledge,
          p90MinutesToAcknowledge,
          oldestUnacknowledgedSentAt,
          bySupervisor,
        ]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        raised:
          type: integer
        acknowledged:
          type: integer
        unacknowledged:
          type: integer
        medianMinutesToAcknowledge:
          type: [number, 'null']
        p90MinutesToAcknowledge:
          type: [number, 'null']
        oldestUnacknowledgedSentAt:
          type: [string, 'null']
          format: date-time
        bySupervisor:
          type: array
          items:
            type: object
            required: [userId, name, acknowledged, medianMinutesToAcknowledge]
            properties:
              userId:
                type: string
                format: uuid
              name:
                type: string
              acknowledged:
                type: integer
              medianMinutesToAcknowledge:
                type: [number, 'null']
    ConsentState:
      type: object
      required: [status, grantedByName, grantedAt, revokedByName, revokedAt]
      properties:
        status:
          type: string
          enum: [active, revoked, none]
        grantedByName:
          type: [string, 'null']
        grantedAt:
          type: [string, 'null']
          format: date-time
        revokedByName:
          type: [string, 'null']
          description: Null for consents revoked before who revoked was recorded.
        revokedAt:
          type: [string, 'null']
          format: date-time
    ConsentRegisterRow:
      type: object
      required: [subjectType, subjectId, name, consents, upcomingVisitsWithoutConsent]
      properties:
        subjectType:
          type: string
          enum: [caregiver, dependant]
        subjectId:
          type: string
          format: uuid
        name:
          type: string
        consents:
          type: object
          required: [location_verification, visit_audio]
          properties:
            location_verification:
              $ref: '#/components/schemas/ConsentState'
            visit_audio:
              $ref: '#/components/schemas/ConsentState'
        upcomingVisitsWithoutConsent:
          type: integer
    TermsDocumentReport:
      type: object
      required: [document, currentVersion, activeUsers, acceptedCurrent, users]
      properties:
        document:
          type: string
          enum: [caregiver, family_member]
        currentVersion:
          type: string
        activeUsers:
          type: integer
        acceptedCurrent:
          type: integer
        users:
          type: array
          description: Every active user of the app, those who haven't accepted the current version first.
          items:
            type: object
            required: [userId, name, acceptedCurrent, lastAcceptedVersion, lastAcceptedAt]
            properties:
              userId:
                type: string
                format: uuid
              name:
                type: string
              acceptedCurrent:
                type: boolean
              lastAcceptedVersion:
                type: [string, 'null']
              lastAcceptedAt:
                type: [string, 'null']
                format: date-time
    AuditLogEntry:
      type: object
      required:
        [id, createdAt, actorUserId, actorName, actorRole, action, entityType, entityId, metadata]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        actorUserId:
          type: [string, 'null']
          format: uuid
          description: Null for the system (a scheduled job).
        actorName:
          type: [string, 'null']
        actorRole:
          type: [string, 'null']
        action:
          type: string
          description: '`<entity>.<verb>`, e.g. `visit_schedule.update`, `consent.revoke`, `compliance.export`.'
        entityType:
          type: string
        entityId:
          type: [string, 'null']
          format: uuid
          description: Null for an action covering no single record, such as an export.
        metadata:
          type: [object, 'null']
          description: What changed (non-sensitive fields as from/to; sensitive ones only as "changed").
    AuditLogPage:
      type: object
      required: [period, items]
      properties:
        period:
          $ref: '#/components/schemas/Period'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        nextCursor:
          type: [string, 'null']
    Notification:
      type: object
      required: [id, type, recipientUserId]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        visitScheduleId:
          type: [string, 'null']
          format: uuid
        recipientUserId:
          type: [string, 'null']
          format: uuid
          description: Null for a missed-visit alert, which is shared by every supervisor; any supervisor may acknowledge it.
        channel:
          type: [string, 'null']
        sentAt:
          type: [string, 'null']
          format: date-time
        acknowledgedAt:
          type: [string, 'null']
          format: date-time
        acknowledgedBy:
          type: [string, 'null']
          format: uuid
    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: [string, 'null']
