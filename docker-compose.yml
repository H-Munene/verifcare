# Local development Postgres, same major version as RDS.
# Host port 5433 avoids clashing with a locally installed Postgres.
#
# Usage: docker compose up -d   (from the repo root)
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mzazi_care_dev
    ports:
      - '5433:5432'
    volumes:
      # postgres 18+ expects the volume at /var/lib/postgresql, not .../data.
      - mzazi_care_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mzazi_care_postgres_data:
